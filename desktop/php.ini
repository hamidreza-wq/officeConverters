[PHP]
extension_dir="ext"
extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=zip
memory_limit=256M
max_execution_time=160
upload_max_filesize=6M
post_max_size=32M
max_file_uploads=5
display_errors=Off
display_startup_errors=Off
log_errors=On
expose_php=Off
date.timezone=UTC
variables_order=EGPCS
zend.exception_ignore_args=On
opcache.enable=Off
opcache.enable_cli=Off
